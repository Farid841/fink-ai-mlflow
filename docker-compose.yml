services:
  postgres:
    image: postgres:17
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 30 
      start_period: 30s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:${RUSTFS_PORT}
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:${RUSTFS_CONSOLE_PORT}
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:${RUSTFS_PORT:-9000}"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:${RUSTFS_CONSOLE_PORT:-9001}"
    volumes:
      - rustfs-data:/data/rustfs
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD", "sh", "-c",
          "curl -f http://localhost:${RUSTFS_PORT}/health && curl -f http://localhost:${RUSTFS_CONSOLE_PORT}/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  rustfs-create-buckets:
    image: minio/mc:latest
    container_name: rustfs-create-buckets
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set rustfs http://rustfs:${RUSTFS_PORT} ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY}
        mc mb --ignore-existing rustfs/${RUSTFS_BUCKET}
        mc mb --ignore-existing rustfs/${RUSTFS_BUCKET_DEV}
        echo "Buckets created successfully"
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      args:
        MLFLOW_PORT: ${MLFLOW_PORT}
    image: mlflow-oidc:latest
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-create-buckets:
        condition: service_completed_successfully
    environment:
      # MLflow
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}
      # Credentials S3 côté serveur MLflow
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # OIDC
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      AUTOMATIC_LOGIN_REDIRECT: "true"
      OIDC_SCOPE: "openid email profile"
      OIDC_GROUPS_ATTRIBUTE: "groups"
      DEFAULT_LANDING_PAGE_IS_PERMISSIONS: "false"
      DEFAULT_MLFLOW_PERMISSIONS: ${DEFAULT_MLFLOW_PERMISSIONS}
      OIDC_GROUP_NAME: ${OIDC_GROUP_NAME}
      OIDC_ADMIN_GROUP_NAME: ${OIDC_ADMIN_GROUP_NAME}
      SKIP_USER_EXISTENCE_CHECK: "true"
      MLFLOW_WEBHOOK_SECRET_ENCRYPTION_KEY: ${MLFLOW_WEBHOOK_SECRET_ENCRYPTION_KEY}
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  webhook-relay:
    build:
      context: ./webhook_relay
      dockerfile: Dockerfile
    image: webhook-relay:latest
    container_name: webhook-relay
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      TRIGGER_ALIASES: ${TRIGGER_ALIASES}
      PORT: ${WEBHOOK_RELAY_PORT}
      MLFLOW_TRACKING_URI: https://${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_RELAY_USERNAME: ${MLFLOW_RELAY_USERNAME}
      MLFLOW_RELAY_PASSWORD: ${MLFLOW_RELAY_PASSWORD}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
    ports:
      - "127.0.0.1:${WEBHOOK_RELAY_PORT}:${WEBHOOK_RELAY_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEBHOOK_RELAY_PORT}/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


volumes:
  postgres_data:
  rustfs-data:

